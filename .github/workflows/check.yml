name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 语法检查（TypeScript type stripping）
        run: |
          node --experimental-strip-types --check src/server.ts
          node --experimental-strip-types --check src/tts.ts
          node --experimental-strip-types --check src/ssml.ts
          node --experimental-strip-types --check src/agent.ts
          node --experimental-strip-types --check src/config.ts
      - name: 启动冒烟测试
        run: |
          PORT=8901 node src/server.ts &
          sleep 2
          curl -fsS http://127.0.0.1:8901/api/health
          curl -fsS http://127.0.0.1:8901/api/capabilities > /dev/null
          curl -fsS http://127.0.0.1:8901/ > /dev/null
